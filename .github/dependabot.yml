version: 2
updates:
  # npm: pnpm workspaces are covered from the root manifest. Weekly, with one PR per group (prod / dev split) rather than one PR per dependency. `cooldown` matches minimumReleaseAge so fresh releases are not picked up until they have aged a week.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    labels:
      - "dependencies"
    cooldown:
      default-days: 7
    groups:
      prod:
        applies-to: version-updates
        dependency-type: "production"
        patterns:
          - "*"
      dev:
        applies-to: version-updates
        dependency-type: "development"
        patterns:
          - "*"

  # GitHub Actions: keep workflow action versions current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    target-branch: "develop"
    labels:
      - "dependencies"
      - "ci"
    groups:
      # One PR per scheduled run for all action bumps. Without grouping you get one PR per action per cycle, which is noise rather than signal.
      gha:
        applies-to: version-updates
        patterns:
          - "*"

  # Docker: base images used by the integration container.
  - package-ecosystem: "docker"
    directory: "/integrations/docker"
    schedule:
      interval: "monthly"
    target-branch: "develop"
    labels:
      - "dependencies"
