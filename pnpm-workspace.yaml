# pnpm 11 reads settings from this file (the "pnpm" field in package.json is no
# longer honored — https://pnpm.io/settings). This IS a monorepo workspace:
# the core engine, CLI, ingestors, and dialect plugins live under packages/.
#
# Build-script decisions:
#   esbuild (used by vitest) — allowed to build.
#   tree-sitter-iec61131-3-st — declined; we load its prebuilt .wasm via
#     web-tree-sitter and never use the native node-gyp binding.
packages:
  - 'packages/*'
  - 'packages/ingestors/*'
  - 'packages/dialects/*'
allowBuilds:
  esbuild: true
  tree-sitter-iec61131-3-st: false
minimumReleaseAgeExclude:
  - tree-sitter-iec61131-3-st@0.1.2
